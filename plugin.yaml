name: context
version: 1.0.0
manifest_version: 2
api_version: 1
provides_tools:
  - fulcra_mesh
  - fulcra_auth
  - fulcra_auth_device
  - fulcra_data_catalog
  - fulcra_create_data_type
  - fulcra_data_type_schema
  - fulcra_data_type_lifecycle
  - fulcra_record
  - fulcra_get_records
  - fulcra_delete_records
  - fulcra_create_share
  - fulcra_update_share
  - fulcra_delete_share
  - fulcra_leave_share
  - fulcra_list_shares
  - fulcra_shared_data_types
  - fulcra_data_updates
  - fulcra_file_upload
  - fulcra_file_download
  - fulcra_file_list
  - fulcra_file_stat
  - fulcra_file_delete
  - fulcra_file_restore
  - fulcra_file_share
  - fulcra_configure_updates
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_tool_call
provides_commands:
  - fulcra
config_schema:
  # Feature switches first; remaining fields only configure those features.
  workspace:
    label: 'Features: workspace'
    type: boolean
    default: false
    description: Load context.md in trusted chats; bootstrap missing workspace files only when enabled.
  updates:
    label: 'Features: updates'
    type: boolean
    default: false
    description: Profile-wide opt-in for trusted chats sharing the OS Fulcra account.
  mesh-messages:
    label: 'Features: mesh-messages'
    type: boolean
    default: false
    description: Read addressed peer messages in trusted chats; never automatically reply or execute.
  mesh-invites:
    label: 'Features: mesh-invites'
    type: boolean
    default: false
    description: Notice narrow incoming share candidates; never automatically accept or share back.
  workspace-name:
    label: 'Workspace: workspace-name'
    type: string
    default: general
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    description: 'Workspace namespace: one stable path segment, not a session ID.'
  workspace-role:
    label: 'Workspace: workspace-role'
    type: string
    default: assistant
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    description: Durable responsibility under member/, shared by successive humans or agents.
  interval:
    label: 'Shared checks: interval (seconds)'
    type: integer
    minimum: 60
    maximum: 86400
    default: 900
    description: Minimum seconds between turn-triggered update and mesh checks; no idle polling.
  mesh-agent:
    label: 'Mesh: mesh-agent'
    type: string
    default: ''
    description: Stable exact local_agent name, required for automatic message reads.
  updates-data-types:
    label: 'Update filters: updates-data-types'
    type: array
    items: {type: string, minLength: 1}
    default: []
    description: Exact data type IDs; empty means all types.
  updates-include-files:
    label: 'Update filters: updates-include-files'
    type: boolean
    default: true
    description: Include file changes in digests.
  updates-file-prefixes:
    label: 'Update filters: updates-file-prefixes'
    type: array
    items: {type: string, minLength: 1}
    default: []
    description: Literal remote path prefixes; empty means all files.
  updates-ignore-prefixes:
    label: 'Update filters: updates-ignore-prefixes'
    type: array
    items: {type: string, minLength: 1}
    default: []
    description: Exclude matching literal file prefixes, overriding includes.
description: Talk with your friends' agents and know what's new on every loop.
author:
  name: Fulcra Dynamics
  email: support@fulcradynamics.com
  url: https://fulcradynamics.com
homepage: https://github.com/fulcradynamics/fulcra-hermes-plugin
repository: https://github.com/fulcradynamics/fulcra-hermes-plugin
license: MIT
keywords:
  - context
  - mesh
  - workspace
  - data
  - coordination
  - loop
