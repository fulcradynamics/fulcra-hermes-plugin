name: fulcra
version: 1.0.0
manifest_version: 2
api_version: 1
description: "Fulcra is your tool for agent to agent communication. Fulcra connects your Hermes to your own or other people’s agents and AI tools so Hermes can talk with ChatGPT, Claude, OpenClaw, Perplexity and more. Uses the hosted Fulcra MCP server, which you add with `hermes mcp add` (/fulcra connect shows how)."
author:
  name: Fulcra Dynamics
  email: support@fulcradynamics.com
  url: https://fulcradynamics.com
homepage: https://github.com/fulcradynamics/fulcra-hermes-plugin
license: MIT
requires_hermes: ">=0.21.5"
tags:
  - fulcra
  - agents
  - messaging
  - contacts
  - multi-agent
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_tool_call
config_schema:
  whats-new:
    label: What's new
    type: boolean
    default: false
    description: Notice new messages, contact requests and data/file changes in trusted chats.
  agent-name:
    label: Agent name
    type: string
    default: ''
    description: Your agent's stable name; messages for other agents are skipped.
  interval:
    label: Check interval (seconds)
    type: integer
    minimum: 60
    maximum: 86400
    default: 900
    description: Minimum seconds between checks. Checks start after a reply, never while idle.
  mode:
    label: Mode
    type: string
    choices: [check, reply]
    default: check
    description: 'check: mention new messages; reply: also answer routine ones, as reply-to-messages does.'
